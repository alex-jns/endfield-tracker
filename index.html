<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arknights: Endfield Tracker</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/favicon.png" />
  </head>

  <body>
    <div class="page-wrapper">
      <header class="header-wrapper">
        <section class="card-header">
          <h1>ARKNIGHTS: ENDFIELD TRACKER</h1>

          <!-- Reset Button -->
          <button id="reset-btn" class="reset-btn">Reset All</button>
        </section>
      </header>

      <main class="cards-container">
        <!-- Talos-II Card -->

        <section class="card">
          <h2><span class="green-highlight">//</span> Talos-II</h2>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Operation Manual
              <span class="green-highlight">//</span>
              Daily
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Operation Manual
              <span class="green-highlight">//</span>
              Index (Sanity)
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Acquisition Center
              <span class="green-highlight">//</span>
              Credit Store
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Depot Node
              <span class="green-highlight">//</span>
              Delivery Jobs (3)
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Collect Rare Growths & Rare Ores
              <img src="img/cosmagaric.png" class="inline-emoji" />
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Claim materials from Recycling Stations
              <img src="img/aerospace-1.png" class="inline-emoji-aero" />
            </label>
          </div>
        </section>

        <!-- OMV Dijiang Card -->

        <section class="card">
          <h2><span class="pink-highlight">//</span> OMV Dijiang</h2>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Control Nexus
              <span class="pink-highlight">//</span>
              Ops Report
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Friends
              <span class="pink-highlight">//</span>
              Send Production Assists (5)
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Friends
              <span class="pink-highlight">//</span> Participate in Clue
              Exchange (5)
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Use Production Assists
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Offer gifts to Operators
            </label>
          </div>
        </section>

        <!-- Valley IV Card -->

        <section class="card">
          <h2><span class="yellow-highlight">//</span> Valley IV</h2>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Regional Development
              <span class="yellow-highlight">//</span>
              Outpost Management
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Stock Redistribution
              <span class="yellow-highlight">//</span> Elastic Goods
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Depot Node <span class="yellow-highlight">//</span> Originium
              Science Park
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Depot Node <span class="yellow-highlight">//</span> Origin
              Lodespring
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Depot Node <span class="yellow-highlight">//</span> Power Plateau
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Eco-Farm
            </label>
          </div>
        </section>

        <!-- Wuling Card -->

        <section class="card">
          <h2><span class="cyan-highlight">//</span> Wuling</h2>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Regional Development
              <span class="cyan-highlight">//</span>
              Outpost Management
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Regional Development
              <span class="cyan-highlight">//</span>
              Environment Monitoring
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Stock Redistribution
              <span class="cyan-highlight">//</span> Elastic Goods
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Depot Node <span class="cyan-highlight">//</span> Wuling City
            </label>
          </div>

          <div class="checkbox-list">
            <label class="checkbox">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Agricultural Test Site
            </label>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
